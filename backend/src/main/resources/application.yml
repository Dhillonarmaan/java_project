server:
  port: 8080

spring:
  config:
    # Load local secrets from backend/.env when present (never committed).
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/keybridge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

keybridge:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 120
  keystore:
    dir: ${KEYSTORE_DIR:./keystore-data}
    password: ${KS_PASSWORD}
    root-alias: keybridge-root
  expiry:
    warn-days: 30
    cron: "0 0 1 * * *"
